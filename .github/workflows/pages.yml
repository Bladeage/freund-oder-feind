name: Pages

# Deploy bei Merge auf main, nur wenn alle Prüfungen grün sind.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check tool tests
      - run: uv run pytest -q
      - run: uv run python tool/validate_manifest.py --release
      # Nur die App ausliefern, keine Prüfberichte, Skripte oder Tests.
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html .nojekyll app assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  ausliefern:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
