name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run ruff format --check tool tests
      - run: uv run ruff check tool tests
      - run: uv run pytest -q
      # main ist live auf GitHub Pages: nur geprüfte, frei lizenzierte Assets mit Prüfbericht
      - run: uv run python tool/validate_manifest.py --release
