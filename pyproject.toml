[project]
name = "freund-oder-feind-tools"
version = "0.1.0"
description = "Asset-Pipeline für die Lern-App Freund oder Feind"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tool"]
